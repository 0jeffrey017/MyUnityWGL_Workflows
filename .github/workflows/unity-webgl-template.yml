name: Reusable Unity WebGL

on:
  workflow_call:
    inputs:
      project_path:
        description: Repository-relative Unity project directory
        type: string
        default: .
      unity_version:
        description: Exact Editor version; empty reads ProjectVersion.txt
        type: string
        default: ''
      cli_version:
        description: Official Unity CLI release, or latest
        type: string
        default: latest
      use_burst:
        description: Keep normal Burst compilation; false passes --burst-disable-compilation
        type: boolean
        default: false
      deploy:
        description: Publish only on pushes to main or master
        type: boolean
        default: false
    secrets:
      UNITY_LICENSE:
        description: Raw ULF contents valid for this runner and licensed for unattended builds
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      UNITY_NON_INTERACTIVE: '1'
      UNITY_NO_PAGER: '1'
      UNITY_NO_BANNER: '1'
    steps:
      - name: Checkout source and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: false
          persist-credentials: false

      - name: Resolve project and exact Editor version
        id: project
        env:
          PROJECT_INPUT: ${{ inputs.project_path }}
          EDITOR_INPUT: ${{ inputs.unity_version }}
          CLI_INPUT: ${{ inputs.cli_version }}
        run: |
          CI_DIAGNOSTICS="$RUNNER_TEMP/unity-diagnostics"
          echo "CI_DIAGNOSTICS=$CI_DIAGNOSTICS" >> "$GITHUB_ENV"
          echo "CI_WEBGL_OUTPUT=$RUNNER_TEMP/webgl-site" >> "$GITHUB_ENV"
          mkdir -p "$CI_DIAGNOSTICS"
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          relative = pathlib.Path(os.environ['PROJECT_INPUT'])
          if relative.is_absolute() or any(c in str(relative) for c in '\r\n'):
              raise SystemExit('project_path must be a repository-relative path')
          project = (root / relative).resolve()
          if not project.is_relative_to(root):
              raise SystemExit('project_path must stay within the checkout')
          version_file = project / 'ProjectSettings/ProjectVersion.txt'
          match = re.search(r'^m_EditorVersion:\s*(\S+)\s*$', version_file.read_text(), re.M)
          version = os.environ['EDITOR_INPUT'] or (match.group(1) if match else '')
          if not re.fullmatch(r'\d+\.\d+\.\d+[abfp]\d+', version):
              raise SystemExit('Use an exact Editor version, e.g. 6000.3.8f1')
          cli = os.environ['CLI_INPUT']
          if cli != 'latest' and not re.fullmatch(r'v?\d+\.\d+\.\d+(?:-[A-Za-z0-9.]+)?', cli):
              raise SystemExit('cli_version must be latest or an exact CLI release')
          if not (project / 'Assets/_Project/Editor/CI/WebGLBuild.cs').is_file():
              raise SystemExit('Selected project must contain the ProjectDefense WebGL build method')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'path={project}\nversion={version}\n')
              output.write(f'cache_scope={hashlib.sha256(str(relative).encode()).hexdigest()[:12]}\n')
          print(f'Project: {project}; Editor: {version}; CLI: {cli}')
          PY
          git lfs fsck

      - name: Install official Unity CLI
        timeout-minutes: 10
        env:
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          curl --fail --silent --show-error --location --retry 3 https://unity.com/install.sh -o "$RUNNER_TEMP/install-unity-cli.sh"
          bash "$RUNNER_TEMP/install-unity-cli.sh" | tee "$CI_DIAGNOSTICS/cli-install.log"
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if [[ "$CLI_VERSION" != latest ]]; then
            unity self-update --target "$CLI_VERSION" --yes --non-interactive
          fi
          unity version --format json > "$CI_DIAGNOSTICS/cli-version.json"
          unity build --help > "$CI_DIAGNOSTICS/build-help.txt"
          unity install --help > "$CI_DIAGNOSTICS/install-help.txt"

      - name: Install matching Editor and WebGL module
        timeout-minutes: 30
        env:
          EDITOR_VERSION: ${{ steps.project.outputs.version }}
        run: |
          unity install "$EDITOR_VERSION" --module webgl --child-modules --yes --accept-eula --non-interactive | tee "$CI_DIAGNOSTICS/editor-install.log"

      - name: Restore Library cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.project.outputs.path }}/Library
          key: UnityLibrary-${{ runner.os }}-${{ steps.project.outputs.cache_scope }}-${{ steps.project.outputs.version }}-WebGL-burst-${{ inputs.use_burst }}-${{ hashFiles(format('{0}/Packages/**', inputs.project_path), format('{0}/ProjectSettings/**', inputs.project_path)) }}-${{ hashFiles(format('{0}/Assets/**', inputs.project_path)) }}
          restore-keys: |
            UnityLibrary-${{ runner.os }}-${{ steps.project.outputs.cache_scope }}-${{ steps.project.outputs.version }}-WebGL-burst-${{ inputs.use_burst }}-${{ hashFiles(format('{0}/Packages/**', inputs.project_path), format('{0}/ProjectSettings/**', inputs.project_path)) }}-

      - name: Activate offline ULF license
        id: license
        timeout-minutes: 5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set +x
          umask 077
          license_file="$RUNNER_TEMP/ci-unity-license.ulf"
          printf '%s' "$UNITY_LICENSE" > "$license_file"
          if [[ ! -s "$license_file" ]]; then
            echo 'UNITY_LICENSE is empty; trusted callers must supply a valid ULF secret.' >&2
            exit 1
          fi
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          if ! timeout 180 unity license activate --file "$license_file" --non-interactive > "$RUNNER_TEMP/unity-activation-private.log" 2>&1; then
            echo 'Offline Unity license activation failed. Check ULF runner identity and entitlement; licensing output is withheld.' >&2
            exit 1
          fi

      - name: Build WebGL with official Unity CLI
        timeout-minutes: 40
        env:
          PROJECT_PATH: ${{ steps.project.outputs.path }}
          EDITOR_VERSION: ${{ steps.project.outputs.version }}
          USE_BURST: ${{ inputs.use_burst }}
        run: |
          args=()
          if [[ "$USE_BURST" != true ]]; then
            args+=(--args '--burst-disable-compilation')
          fi
          unity build "$PROJECT_PATH" \
            --editor-version "$EDITOR_VERSION" \
            --target WebGL \
            --execute-method ProjectDefense.Editor.CI.WebGLBuild.Build \
            --output-path "$CI_WEBGL_OUTPUT" \
            --log-file "$CI_DIAGNOSTICS/webgl-build.log" \
            --provenance-path "$CI_DIAGNOSTICS/build-provenance.json" \
            --timeout 2100 --no-tail --non-interactive "${args[@]}"
          test -s "$CI_WEBGL_OUTPUT/index.html"

      - name: Return license and remove private files
        if: always()
        timeout-minutes: 5
        env:
          ACTIVATION_ATTEMPTED: ${{ steps.license.outputs.attempted }}
        run: |
          set +x
          trap 'rm -f -- "$RUNNER_TEMP/ci-unity-license.ulf" "$RUNNER_TEMP/unity-activation-private.log" "$RUNNER_TEMP/unity-return-private.log"' EXIT
          if [[ "$ACTIVATION_ATTEMPTED" == true ]]; then
            if ! timeout 180 unity license return --yes --non-interactive > "$RUNNER_TEMP/unity-return-private.log" 2>&1; then
              echo 'Unity license return failed; check seat status with the license administrator. Private files will still be removed.' >&2
              exit 1
            fi
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-webgl-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unity-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: unity-webgl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webgl-site/
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Pages artifact
        if: inputs.deploy && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/webgl-site/

  deploy:
    needs: build
    if: inputs.deploy && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: unity-webgl-pages-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
